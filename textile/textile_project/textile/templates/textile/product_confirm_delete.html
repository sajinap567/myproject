{% extends 'textile/base.html' %}
{% block content %}
<div class="alert alert-warning shadow">
  <h4>Are you sure you want to delete "{{ object.name }}"?</h4>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm Delete</button>
    <a href="{% url 'product-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
